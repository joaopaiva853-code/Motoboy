<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes, maximum-scale=1.0">
    <title>MotoFlash · Gestão de Entregas</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts: Inter para excelente legibilidade -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, #0b1120 0%, #19233c 100%);
            min-height: 100vh;
            padding: 18px 14px 40px 14px;
        }

        /* container principal com fundo leve e bordas arredondadas */
        .app-card {
            max-width: 550px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(0px);
            border-radius: 44px;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255,255,255,0.1);
            overflow: hidden;
            padding: 22px 20px 32px 20px;
            transition: all 0.2s;
        }

        /* cabeçalho com degrade */
        .header {
            background: linear-gradient(135deg, #e11d48 0%, #f97316 100%);
            margin: -22px -20px 28px -20px;
            padding: 26px 20px 28px 20px;
            border-radius: 0 0 44px 44px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.1);
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .logo-icon {
            background: rgba(255,255,255,0.2);
            width: 54px;
            height: 54px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            backdrop-filter: blur(4px);
        }
        .title h1 {
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: -0.3px;
            line-height: 1.2;
        }
        .title p {
            font-size: 0.75rem;
            opacity: 0.9;
            font-weight: 500;
        }

        /* cards estatísticas com vidro */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: rgba(248, 250, 252, 0.95);
            border-radius: 28px;
            padding: 14px 6px;
            text-align: center;
            box-shadow: 0 5px 12px rgba(0,0,0,0.03);
            transition: transform 0.1s ease;
            border: 1px solid rgba(225,29,72,0.15);
        }
        .stat-value {
            font-size: 1.9rem;
            font-weight: 800;
            color: #0f172a;
            line-height: 1.2;
        }
        .stat-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: #334155;
            margin-top: 6px;
            letter-spacing: 0.2px;
            text-transform: uppercase;
        }

        /* filtros estilo pílula */
        .filter-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 24px;
            justify-content: center;
        }
        .filter-btn {
            background: #f1f5f9;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.8rem;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            flex: 0 0 auto;
        }
        .filter-btn.active {
            background: linear-gradient(95deg, #e11d48, #f97316);
            color: white;
            box-shadow: 0 4px 10px rgba(225,29,72,0.3);
        }

        /* lista de entregas (cards modernos) */
        .deliveries-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 28px;
            max-height: 500px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .delivery-card {
            background: white;
            border-radius: 28px;
            padding: 18px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05), 0 1px 2px rgba(0,0,0,0.02);
            border: 1px solid #f0f2f8;
            transition: all 0.2s;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .client-name {
            font-weight: 800;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #0f172a;
        }
        .client-name i {
            color: #e11d48;
            font-size: 1.2rem;
        }
        .status-tag {
            font-size: 0.7rem;
            font-weight: 800;
            padding: 5px 12px;
            border-radius: 30px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .status-pendente { background: #fff3e3; color: #c2410c; }
        .status-em_andamento { background: #e0f2fe; color: #0369a1; }
        .status-entregue { background: #dcfce7; color: #15803d; }

        .address {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 0.9rem;
            color: #334155;
            margin: 12px 0 10px 0;
            word-break: break-word;
            font-weight: 500;
        }
        .address i {
            margin-top: 3px;
            color: #f97316;
        }
        .price-row {
            font-weight: 800;
            font-size: 1.2rem;
            color: #0f172a;
            margin: 8px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .price-row i {
            color: #e11d48;
        }
        .meta-info {
            font-size: 0.7rem;
            color: #5b6e8c;
            display: flex;
            gap: 12px;
            margin-top: 10px;
            flex-wrap: wrap;
            font-weight: 500;
        }
        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .btn-icon {
            border: none;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 8px 14px;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
        }
        .btn-icon i { font-size: 0.9rem; }
        .btn-edit { background: #eef2ff; color: #2563eb; }
        .btn-delete { background: #fff1f2; color: #e11d48; }
        .btn-start { background: #e0f2fe; color: #0284c7; }
        .btn-finish { background: #dcfce7; color: #16a34a; }
        .map-link {
            background: #f1f5f9;
            padding: 5px 12px;
            border-radius: 40px;
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #3b82f6;
        }

        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: #6c7a91;
            font-weight: 500;
        }

        /* botão flutuante + gradiente */
        .fab-add {
            background: linear-gradient(145deg, #e11d48, #f97316);
            border: none;
            width: 64px;
            height: 64px;
            border-radius: 36px;
            color: white;
            font-size: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 8px auto 0 auto;
            box-shadow: 0 10px 22px rgba(225,29,72,0.4);
            cursor: pointer;
            transition: 0.2s;
        }
        .fab-add:active { transform: scale(0.94); }

        /* MODAL profissional com gradiente nos botões */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(6px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 18px;
        }
        .modal-card {
            background: white;
            max-width: 520px;
            width: 100%;
            border-radius: 44px;
            padding: 28px 24px;
            box-shadow: 0 30px 40px rgba(0,0,0,0.3);
            animation: fadeSlide 0.2s ease;
        }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(25px);}
            to { opacity: 1; transform: translateY(0);}
        }
        .modal-card h2 {
            font-size: 1.7rem;
            font-weight: 800;
            background: linear-gradient(135deg, #e11d48, #f97316);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            font-weight: 700;
            font-size: 0.8rem;
            display: block;
            margin-bottom: 8px;
            color: #1e293b;
        }
        .form-group label i { margin-right: 6px; color: #e11d48; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            border-radius: 32px;
            border: 1.5px solid #e2e8f0;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            background: #fefefe;
            transition: 0.2s;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #e11d48;
            box-shadow: 0 0 0 3px rgba(225,29,72,0.2);
        }
        .modal-buttons {
            display: flex;
            gap: 14px;
            justify-content: flex-end;
            margin-top: 26px;
        }
        .btn-save {
            background: linear-gradient(95deg, #e11d48, #f97316);
            border: none;
            color: white;
            padding: 12px 26px;
            border-radius: 44px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .btn-cancel {
            background: #f1f5f9;
            border: none;
            padding: 12px 24px;
            border-radius: 44px;
            font-weight: 600;
            cursor: pointer;
        }
        footer {
            font-size: 0.7rem;
            text-align: center;
            margin-top: 16px;
            color: #8ba0bc;
            font-weight: 500;
        }

        /* scroll personalizado */
        .deliveries-list::-webkit-scrollbar {
            width: 4px;
        }
        .deliveries-list::-webkit-scrollbar-track {
            background: #eef2ff;
            border-radius: 10px;
        }
        .deliveries-list::-webkit-scrollbar-thumb {
            background: #e11d48;
            border-radius: 10px;
        }

        @media (max-width: 480px) {
            .app-card { padding: 18px 16px 28px; }
            .header { margin: -18px -16px 24px -16px; padding: 20px 16px; }
            .stat-value { font-size: 1.6rem; }
            .client-name { font-size: 1.1rem; }
            .btn-icon { padding: 6px 12px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>
<div class="app-card">
    <div class="header">
        <div class="logo-area">
            <div class="logo-icon"><i class="fas fa-bolt"></i></div>
            <div class="title">
                <h1>MotoFlash</h1>
                <p>Suas corridas • Entregas locais</p>
            </div>
        </div>
        <!-- botão demo removido conforme solicitado -->
    </div>

    <!-- indicadores principais -->
    <div class="stats-grid">
        <div class="stat-card"><div class="stat-value" id="totalDeliveries">0</div><div class="stat-label">Total</div></div>
        <div class="stat-card"><div class="stat-value" id="pendingCount">0</div><div class="stat-label">Pendentes</div></div>
        <div class="stat-card"><div class="stat-value" id="earningsTotal">R$0</div><div class="stat-label">Receita</div></div>
    </div>

    <!-- filtros intuitivos -->
    <div class="filter-bar">
        <button class="filter-btn active" data-filter="all">📋 Todas</button>
        <button class="filter-btn" data-filter="pendente">⏳ Pendentes</button>
        <button class="filter-btn" data-filter="em_andamento">🏍️ Em andamento</button>
        <button class="filter-btn" data-filter="entregue">✅ Entregues</button>
    </div>

    <!-- lista dinâmica -->
    <div id="deliveriesList" class="deliveries-list">
        <div class="empty-state"><i class="fas fa-motorcycle" style="font-size: 2rem; display: block; margin-bottom: 12px;"></i> Nenhuma entrega.<br>Toque no botão + para criar</div>
    </div>

    <button class="fab-add" id="openAddModal"><i class="fas fa-plus"></i></button>
    <footer><i class="fas fa-edit"></i> Edite, inicie ou finalize • dados salvos no celular</footer>
</div>

<!-- MODAL editar/criar -->
<div id="modalOverlay" class="modal">
    <div class="modal-card">
        <h2 id="modalTitle">➕ Nova corrida</h2>
        <form id="deliveryForm">
            <input type="hidden" id="editId" value="">
            <div class="form-group">
                <label><i class="fas fa-user"></i> Cliente *</label>
                <input type="text" id="cliente" placeholder="Ex: Ana Clara" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-location-dot"></i> Endereço completo *</label>
                <input type="text" id="endereco" placeholder="Rua, número, bairro, cidade" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-dollar-sign"></i> Valor (R$)</label>
                <input type="number" id="valor" step="0.01" placeholder="0,00" value="0">
            </div>
            <div class="form-group">
                <label><i class="fas fa-tasks"></i> Status</label>
                <select id="statusSelect">
                    <option value="pendente">Pendente</option>
                    <option value="em_andamento">Em andamento</option>
                    <option value="entregue">Entregue</option>
                </select>
            </div>
            <div class="form-group">
                <label><i class="fas fa-comment-dots"></i> Observações (opcional)</label>
                <textarea id="obs" rows="2" placeholder="Portão, campainha, ponto de referência..."></textarea>
            </div>
            <div class="modal-buttons">
                <button type="button" class="btn-cancel" id="closeModalBtn">Cancelar</button>
                <button type="submit" class="btn-save">Salvar corrida</button>
            </div>
        </form>
    </div>
</div>

<script>
    // ---------- DADOS ----------
    let deliveries = [];
    let currentFilter = "all";

    // localStorage
    function loadData() {
        const stored = localStorage.getItem("motoflash_deliveries");
        if(stored) {
            deliveries = JSON.parse(stored);
        } else {
            // exemplo de dados iniciais (cidade local, realista)
            deliveries = [
                {
                    id: "d1",
                    cliente: "Camila Mendes",
                    endereco: "Rua Augusta, 1050 - Cerqueira César, São Paulo",
                    valor: 15.90,
                    status: "pendente",
                    observacoes: "Entregar no apto 22, interfone 22",
                    criado_em: new Date(Date.now() - 7200000).toISOString(),
                    entregue_em: null
                },
                {
                    id: "d2",
                    cliente: "Thiago Souza",
                    endereco: "Av. Paulista, 2000 - Bela Vista, São Paulo",
                    valor: 22.50,
                    status: "em_andamento",
                    observacoes: "Próximo ao metrô, rampa de acesso",
                    criado_em: new Date(Date.now() - 3600000).toISOString(),
                    entregue_em: null
                },
                {
                    id: "d3",
                    cliente: "Fernanda Rocha",
                    endereco: "Rua dos Pinheiros, 345 - Pinheiros, São Paulo",
                    valor: 18.00,
                    status: "entregue",
                    observacoes: "Deixar na portaria 24h",
                    criado_em: new Date(Date.now() - 172800000).toISOString(),
                    entregue_em: new Date(Date.now() - 86400000).toISOString()
                }
            ];
            saveToLocal();
        }
        renderStats();
        renderList();
    }

    function saveToLocal() {
        localStorage.setItem("motoflash_deliveries", JSON.stringify(deliveries));
    }

    function generateId() {
        return Date.now().toString(36) + Math.random().toString(36).substr(2, 6);
    }

    // Salvar criação ou edição
    function saveDelivery(event) {
        event.preventDefault();
        const id = document.getElementById("editId").value;
        const cliente = document.getElementById("cliente").value.trim();
        const endereco = document.getElementById("endereco").value.trim();
        const valor = parseFloat(document.getElementById("valor").value) || 0;
        const status = document.getElementById("statusSelect").value;
        const observacoes = document.getElementById("obs").value.trim();

        if(!cliente || !endereco) {
            alert("Preencha o nome do cliente e o endereço.");
            return;
        }

        if(id) {
            // edição
            const idx = deliveries.findIndex(d => d.id === id);
            if(idx !== -1) {
                const oldStatus = deliveries[idx].status;
                deliveries[idx].cliente = cliente;
                deliveries[idx].endereco = endereco;
                deliveries[idx].valor = valor;
                deliveries[idx].observacoes = observacoes;
                deliveries[idx].status = status;
                if(status === "entregue" && oldStatus !== "entregue") {
                    deliveries[idx].entregue_em = new Date().toISOString();
                } else if(status !== "entregue") {
                    deliveries[idx].entregue_em = null;
                } else if(status === "entregue" && !deliveries[idx].entregue_em) {
                    deliveries[idx].entregue_em = new Date().toISOString();
                }
            }
        } else {
            // nova entrega
            const newDelivery = {
                id: generateId(),
                cliente,
                endereco,
                valor,
                status,
                observacoes,
                criado_em: new Date().toISOString(),
                entregue_em: status === "entregue" ? new Date().toISOString() : null,
            };
            deliveries.unshift(newDelivery);
        }
        saveToLocal();
        closeModal();
        renderStats();
        renderList();
    }

    function deleteDelivery(id) {
        if(confirm("Remover esta corrida permanentemente?")) {
            deliveries = deliveries.filter(d => d.id !== id);
            saveToLocal();
            renderStats();
            renderList();
        }
    }

    function quickUpdateStatus(id, newStatus) {
        const idx = deliveries.findIndex(d => d.id === id);
        if(idx !== -1) {
            const oldStatus = deliveries[idx].status;
            deliveries[idx].status = newStatus;
            if(newStatus === "entregue" && oldStatus !== "entregue") {
                deliveries[idx].entregue_em = new Date().toISOString();
            } else if(newStatus !== "entregue") {
                deliveries[idx].entregue_em = null;
            }
            saveToLocal();
            renderStats();
            renderList();
        }
    }

    function openEditModal(id) {
        const d = deliveries.find(d => d.id === id);
        if(d) {
            document.getElementById("modalTitle").innerHTML = "✏️ Editar entrega";
            document.getElementById("editId").value = d.id;
            document.getElementById("cliente").value = d.cliente;
            document.getElementById("endereco").value = d.endereco;
            document.getElementById("valor").value = d.valor;
            document.getElementById("statusSelect").value = d.status;
            document.getElementById("obs").value = d.observacoes || "";
            document.getElementById("modalOverlay").style.display = "flex";
        }
    }

    function openCreateModal() {
        document.getElementById("modalTitle").innerHTML = "➕ Nova corrida";
        document.getElementById("editId").value = "";
        document.getElementById("cliente").value = "";
        document.getElementById("endereco").value = "";
        document.getElementById("valor").value = "0";
        document.getElementById("statusSelect").value = "pendente";
        document.getElementById("obs").value = "";
        document.getElementById("modalOverlay").style.display = "flex";
    }

    function closeModal() {
        document.getElementById("modalOverlay").style.display = "none";
    }

    function renderStats() {
        const total = deliveries.length;
        const pending = deliveries.filter(d => d.status === "pendente").length;
        const earnings = deliveries.filter(d => d.status === "entregue").reduce((acc, d) => acc + (d.valor || 0), 0);
        document.getElementById("totalDeliveries").innerText = total;
        document.getElementById("pendingCount").innerText = pending;
        document.getElementById("earningsTotal").innerHTML = `R$${earnings.toFixed(2)}`;
    }

    function escapeHtml(str) {
        if(!str) return '';
        return str.replace(/[&<>]/g, (m) => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
    }

    function renderList() {
        let filtered = [...deliveries];
        if(currentFilter !== "all") filtered = filtered.filter(d => d.status === currentFilter);
        // ordenação: pendentes e em andamento primeiro, depois entregues
        filtered.sort((a,b) => {
            const order = { pendente: 1, em_andamento: 2, entregue: 3 };
            const oa = order[a.status] || 4;
            const ob = order[b.status] || 4;
            if(oa !== ob) return oa - ob;
            return new Date(b.criado_em) - new Date(a.criado_em);
        });

        const container = document.getElementById("deliveriesList");
        if(filtered.length === 0) {
            container.innerHTML = `<div class="empty-state"><i class="fas fa-road" style="font-size: 2rem; display: block; margin-bottom: 12px;"></i> Nenhuma corrida aqui.<br>Toque em + para adicionar</div>`;
            return;
        }

        container.innerHTML = filtered.map(del => {
            const statusText = { pendente: "Pendente", em_andamento: "Em andamento", entregue: "Entregue" }[del.status];
            const statusClass = `status-${del.status}`;
            const valorFormat = (del.valor || 0).toFixed(2);
            const criadoData = new Date(del.criado_em).toLocaleDateString("pt-BR", { day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit" });
            let actionButtons = "";
            if(del.status === "pendente") {
                actionButtons = `<button class="btn-icon btn-start" data-action="start" data-id="${del.id}"><i class="fas fa-play"></i> Iniciar</button>`;
            } else if(del.status === "em_andamento") {
                actionButtons = `<button class="btn-icon btn-finish" data-action="finish" data-id="${del.id}"><i class="fas fa-flag-checkered"></i> Concluir</button>`;
            }
            const mapsLink = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(del.endereco)}`;
            return `
                <div class="delivery-card">
                    <div class="card-header">
                        <div class="client-name"><i class="fas fa-user-circle"></i> ${escapeHtml(del.cliente)}</div>
                        <div class="status-tag ${statusClass}">${statusText}</div>
                    </div>
                    <div class="address">
                        <i class="fas fa-map-marker-alt"></i> <span>${escapeHtml(del.endereco)}</span>
                        <a href="${mapsLink}" target="_blank" class="map-link" rel="noopener"><i class="fas fa-external-link-alt"></i> mapa</a>
                    </div>
                    <div class="price-row"><i class="fas fa-tag"></i> R$ ${valorFormat}</div>
                    <div class="meta-info">
                        <span><i class="far fa-clock"></i> ${criadoData}</span>
                        ${del.observacoes ? `<span><i class="fas fa-pen"></i> ${escapeHtml(del.observacoes.substring(0, 40))}</span>` : ''}
                    </div>
                    <div class="card-actions">
                        <button class="btn-icon btn-edit" data-action="edit" data-id="${del.id}"><i class="fas fa-pencil-alt"></i> Editar</button>
                        ${actionButtons}
                        <button class="btn-icon btn-delete" data-action="delete" data-id="${del.id}"><i class="fas fa-trash-alt"></i> Excluir</button>
                    </div>
                </div>
            `;
        }).join("");

        // Eventos dinâmicos
        document.querySelectorAll("[data-action='edit']").forEach(btn => {
            btn.addEventListener("click", (e) => { e.stopPropagation(); openEditModal(btn.getAttribute("data-id")); });
        });
        document.querySelectorAll("[data-action='delete']").forEach(btn => {
            btn.addEventListener("click", (e) => { e.stopPropagation(); deleteDelivery(btn.getAttribute("data-id")); });
        });
        document.querySelectorAll("[data-action='start']").forEach(btn => {
            btn.addEventListener("click", (e) => { e.stopPropagation(); quickUpdateStatus(btn.getAttribute("data-id"), "em_andamento"); });
        });
        document.querySelectorAll("[data-action='finish']").forEach(btn => {
            btn.addEventListener("click", (e) => { e.stopPropagation(); quickUpdateStatus(btn.getAttribute("data-id"), "entregue"); });
        });
    }

    // filtros interativos
    function initFilters() {
        const btns = document.querySelectorAll(".filter-btn");
        btns.forEach(btn => {
            btn.addEventListener("click", () => {
                btns.forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                currentFilter = btn.getAttribute("data-filter");
                renderList();
            });
        });
    }

    // eventos principais
    document.getElementById("deliveryForm").addEventListener("submit", saveDelivery);
    document.getElementById("openAddModal").addEventListener("click", openCreateModal);
    document.getElementById("closeModalBtn").addEventListener("click", closeModal);
    window.addEventListener("click", (e) => { if(e.target === document.getElementById("modalOverlay")) closeModal(); });

    // inicialização
    loadData();
    initFilters();
</script>
</body>
</html>
