<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes, maximum-scale=1.0">
    <title>MotoFlash · Painel de Entregas</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts: Inter para legibilidade -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 10% 20%, #0a0f1c, #05070f);
            min-height: 100vh;
            padding: 20px 16px 40px;
        }

        /* Container principal com efeito vidro */
        .glass-app {
            max-width: 580px;
            margin: 0 auto;
            background: rgba(18, 25, 45, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 56px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            overflow: hidden;
            padding: 24px 20px 32px;
        }

        /* Cabeçalho com gradiente neon */
        .header-glow {
            background: linear-gradient(115deg, #ff1b6b 0%, #ff7e3a 100%);
            margin: -24px -20px 28px -20px;
            padding: 28px 20px 32px;
            border-radius: 0 0 48px 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            box-shadow: 0 12px 22px rgba(0,0,0,0.3);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .brand-icon {
            background: rgba(255,255,255,0.2);
            width: 52px;
            height: 52px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            backdrop-filter: blur(5px);
        }
        .brand-text h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        .brand-text p {
            font-size: 0.75rem;
            font-weight: 500;
            opacity: 0.9;
        }

        /* Cards estatísticos com vidro escuro */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 28px;
        }
        .stat-glass {
            background: rgba(10, 15, 27, 0.6);
            backdrop-filter: blur(4px);
            border-radius: 32px;
            padding: 14px 6px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.15);
            transition: 0.2s;
        }
        .stat-number {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f8fafc, #cbd5e6);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .stat-label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #a0b3d9;
        }

        /* Filtros com estilo moderno */
        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 26px;
            justify-content: center;
        }
        .filter-chip {
            background: rgba(255,255,255,0.08);
            border: none;
            padding: 8px 20px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.8rem;
            color: #e2e8f0;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            backdrop-filter: blur(4px);
        }
        .filter-chip.active {
            background: linear-gradient(105deg, #ff1b6b, #ff7e3a);
            color: white;
            box-shadow: 0 4px 12px rgba(255, 30, 86, 0.4);
        }

        /* Lista de entregas com cards modernos */
        .delivery-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 28px;
            max-height: 520px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .task-card {
            background: rgba(12, 18, 32, 0.8);
            backdrop-filter: blur(8px);
            border-radius: 32px;
            padding: 18px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.2s ease;
        }
        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .customer {
            font-weight: 800;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #f1f5f9;
        }
        .badge-status {
            font-size: 0.7rem;
            font-weight: 800;
            padding: 5px 14px;
            border-radius: 40px;
            text-transform: uppercase;
        }
        .badge-pendente { background: #ffedd5; color: #b45309; }
        .badge-andamento { background: #dbeafe; color: #1e4b8f; }
        .badge-entregue { background: #dcfce7; color: #15803d; }

        .address-line {
            display: flex;
            gap: 10px;
            font-size: 0.9rem;
            color: #cbd5e1;
            margin: 12px 0 10px;
            word-break: break-word;
        }
        .value {
            font-weight: 800;
            font-size: 1.2rem;
            color: #facc15;
            margin: 8px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .meta {
            font-size: 0.7rem;
            color: #8ba0bc;
            display: flex;
            gap: 14px;
            margin-top: 10px;
        }
        .actions {
            display: flex;
            gap: 12px;
            margin-top: 18px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .action-btn {
            border: none;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.1s;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(2px);
            color: #e2e8f0;
        }
        .btn-edit { background: #2d3a5e; color: #90caf9; }
        .btn-delete { background: #4a2532; color: #fda4af; }
        .btn-start { background: #1f3b4c; color: #7dd3fc; }
        .btn-finish { background: #1e3a2f; color: #86efac; }
        .map-link {
            background: rgba(0,0,0,0.3);
            padding: 5px 12px;
            border-radius: 40px;
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: 600;
            color: #60a5fa;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .empty {
            text-align: center;
            padding: 48px 16px;
            color: #a0b3d9;
        }

        /* Botão flutuante */
        .fab {
            background: linear-gradient(145deg, #ff1b6b, #ff7e3a);
            width: 68px;
            height: 68px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 8px auto 0;
            border: none;
            color: white;
            font-size: 32px;
            box-shadow: 0 8px 20px rgba(255, 30, 86, 0.5);
            cursor: pointer;
            transition: 0.15s;
        }
        .fab:active { transform: scale(0.94); }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-content {
            background: #0f172ad9;
            backdrop-filter: blur(16px);
            max-width: 500px;
            width: 100%;
            border-radius: 48px;
            padding: 28px 24px;
            border: 1px solid rgba(255,255,255,0.2);
            animation: fadeUp 0.2s;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px);}
            to { opacity: 1; transform: translateY(0);}
        }
        .modal-content h2 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffb3c6, #ff9a5e);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            font-weight: 600;
            font-size: 0.8rem;
            display: block;
            margin-bottom: 8px;
            color: #cbd5e6;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            border-radius: 32px;
            border: none;
            background: #1e293b;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
        }
        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 26px;
        }
        .btn-save-modal {
            background: linear-gradient(105deg, #ff1b6b, #ff7e3a);
            border: none;
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: 700;
            color: white;
        }
        .btn-cancel-modal {
            background: #334155;
            border: none;
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: 600;
            color: #f1f5f9;
        }
        footer {
            font-size: 0.7rem;
            text-align: center;
            margin-top: 20px;
            color: #7e8aa8;
        }

        /* scroll */
        .delivery-list::-webkit-scrollbar { width: 4px; }
        .delivery-list::-webkit-scrollbar-track { background: #1e293b; border-radius: 10px; }
        .delivery-list::-webkit-scrollbar-thumb { background: #ff4d6d; border-radius: 10px; }
    </style>
</head>
<body>
<div class="glass-app">
    <div class="header-glow">
        <div class="brand">
            <div class="brand-icon"><i class="fas fa-rocket"></i></div>
            <div class="brand-text">
                <h1>MotoFlash</h1>
                <p>Entregas inteligentes</p>
            </div>
        </div>
        <!-- sem botão demo, conforme solicitado -->
    </div>

    <div class="stats-row">
        <div class="stat-glass"><div class="stat-number" id="totalCount">0</div><div class="stat-label">Corridas</div></div>
        <div class="stat-glass"><div class="stat-number" id="pendingCount">0</div><div class="stat-label">Pendentes</div></div>
        <div class="stat-glass"><div class="stat-number" id="totalEarn">R$0</div><div class="stat-label">Ganhos</div></div>
    </div>

    <div class="filters">
        <button class="filter-chip active" data-filter="all">📋 Todas</button>
        <button class="filter-chip" data-filter="pendente">⏳ Pendentes</button>
        <button class="filter-chip" data-filter="em_andamento">🏍️ Andamento</button>
        <button class="filter-chip" data-filter="entregue">✅ Entregues</button>
    </div>

    <div id="deliveryList" class="delivery-list">
        <div class="empty"><i class="fas fa-motorcycle" style="font-size: 2rem; display: block; margin-bottom: 10px;"></i> Nenhuma entrega<br>Toque no botão + para criar</div>
    </div>

    <button class="fab" id="openModalBtn"><i class="fas fa-plus"></i></button>
    <footer><i class="fas fa-edit"></i> Edite corridas • dados salvos no seu dispositivo</footer>
</div>

<div id="modalOverlay" class="modal-overlay">
    <div class="modal-content">
        <h2 id="modalTitle">➕ Nova corrida</h2>
        <form id="deliveryForm">
            <input type="hidden" id="editId">
            <div class="form-group"><label><i class="fas fa-user"></i> Cliente</label><input type="text" id="cliente" placeholder="Ex: Mariana Costa" required></div>
            <div class="form-group"><label><i class="fas fa-location-dot"></i> Endereço completo</label><input type="text" id="endereco" placeholder="Rua, número, bairro, cidade" required></div>
            <div class="form-group"><label><i class="fas fa-tag"></i> Valor (R$)</label><input type="number" id="valor" step="0.01" value="0"></div>
            <div class="form-group"><label><i class="fas fa-tasks"></i> Status</label><select id="status"><option value="pendente">Pendente</option><option value="em_andamento">Em andamento</option><option value="entregue">Entregue</option></select></div>
            <div class="form-group"><label><i class="fas fa-comment"></i> Observações</label><textarea id="obs" rows="2" placeholder="Informações adicionais..."></textarea></div>
            <div class="modal-buttons"><button type="button" class="btn-cancel-modal" id="closeModalBtn">Cancelar</button><button type="submit" class="btn-save-modal">Salvar corrida</button></div>
        </form>
    </div>
</div>

<script>
    // ---------- GESTÃO DE DADOS ----------
    let deliveries = [];
    let currentFilter = "all";

    function loadFromStorage() {
        const stored = localStorage.getItem("motoflash_deliveries_v2");
        if(stored) {
            deliveries = JSON.parse(stored);
        } else {
            deliveries = [
                { id: "d1", cliente: "Larissa Mendes", endereco: "Rua Augusta, 1240 - Consolação, SP", valor: 14.90, status: "pendente", observacoes: "Apto 33B", criado_em: new Date(Date.now() - 3600000).toISOString(), entregue_em: null },
                { id: "d2", cliente: "Ricardo Nunes", endereco: "Av. Paulista, 2000 - Bela Vista, SP", valor: 22.30, status: "em_andamento", observacoes: "Portaria 24h", criado_em: new Date(Date.now() - 7200000).toISOString(), entregue_em: null },
                { id: "d3", cliente: "Camila Rocha", endereco: "Rua dos Pinheiros, 678 - Pinheiros, SP", valor: 18.50, status: "entregue", observacoes: "Deixar na recepção", criado_em: new Date(Date.now() - 86400000).toISOString(), entregue_em: new Date(Date.now() - 43200000).toISOString() }
            ];
            saveToStorage();
        }
        updateStatsAndList();
    }

    function saveToStorage() {
        localStorage.setItem("motoflash_deliveries_v2", JSON.stringify(deliveries));
    }

    function generateId() { return Date.now().toString(36) + Math.random().toString(36).substring(2,6); }

    function updateStatsAndList() {
        const total = deliveries.length;
        const pending = deliveries.filter(d => d.status === "pendente").length;
        const earnings = deliveries.filter(d => d.status === "entregue").reduce((acc, d) => acc + (d.valor || 0), 0);
        document.getElementById("totalCount").innerText = total;
        document.getElementById("pendingCount").innerText = pending;
        document.getElementById("totalEarn").innerHTML = `R$${earnings.toFixed(2)}`;
        renderList();
    }

    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, (m) => m==='&'?'&amp;':(m==='<'?'&lt;':'&gt;')); }

    function renderList() {
        let filtered = [...deliveries];
        if(currentFilter !== "all") filtered = filtered.filter(d => d.status === currentFilter);
        filtered.sort((a,b) => {
            const order = { pendente:1, em_andamento:2, entregue:3 };
            if(order[a.status] !== order[b.status]) return order[a.status] - order[b.status];
            return new Date(b.criado_em) - new Date(a.criado_em);
        });
        const container = document.getElementById("deliveryList");
        if(filtered.length === 0) {
            container.innerHTML = `<div class="empty"><i class="fas fa-road" style="font-size: 2rem;"></i><br>Nenhuma corrida encontrada</div>`;
            return;
        }
        container.innerHTML = filtered.map(d => {
            const statusLabel = { pendente:"Pendente", em_andamento:"Em andamento", entregue:"Entregue" }[d.status];
            const statusClass = `badge-${d.status === "em_andamento" ? "andamento" : d.status}`;
            const mapsLink = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(d.endereco)}`;
            let actionButtons = "";
            if(d.status === "pendente") actionButtons = `<button class="action-btn btn-start" data-action="start" data-id="${d.id}"><i class="fas fa-play"></i> Iniciar</button>`;
            else if(d.status === "em_andamento") actionButtons = `<button class="action-btn btn-finish" data-action="finish" data-id="${d.id}"><i class="fas fa-check-double"></i> Concluir</button>`;
            return `
                <div class="task-card">
                    <div class="task-header">
                        <div class="customer"><i class="fas fa-user-astronaut"></i> ${escapeHtml(d.cliente)}</div>
                        <div class="badge-status ${statusClass}">${statusLabel}</div>
                    </div>
                    <div class="address-line"><i class="fas fa-map-marker-alt"></i> ${escapeHtml(d.endereco)} <a href="${mapsLink}" target="_blank" class="map-link"><i class="fas fa-external-link-alt"></i> mapa</a></div>
                    <div class="value"><i class="fas fa-coins"></i> R$ ${(d.valor || 0).toFixed(2)}</div>
                    <div class="meta"><span><i class="far fa-calendar"></i> ${new Date(d.criado_em).toLocaleDateString("pt-BR", { hour:"2-digit", minute:"2-digit" })}</span>${d.observacoes ? `<span><i class="fas fa-pen"></i> ${escapeHtml(d.observacoes.substring(0, 40))}</span>` : ''}</div>
                    <div class="actions">
                        <button class="action-btn btn-edit" data-action="edit" data-id="${d.id}"><i class="fas fa-edit"></i> Editar</button>
                        ${actionButtons}
                        <button class="action-btn btn-delete" data-action="delete" data-id="${d.id}"><i class="fas fa-trash-alt"></i> Excluir</button>
                    </div>
                </div>
            `;
        }).join("");

        // eventos dos botões dinâmicos
        document.querySelectorAll("[data-action='edit']").forEach(btn => btn.addEventListener("click", (e) => { e.stopPropagation(); openEditModal(btn.dataset.id); }));
        document.querySelectorAll("[data-action='delete']").forEach(btn => btn.addEventListener("click", (e) => { e.stopPropagation(); deleteDelivery(btn.dataset.id); }));
        document.querySelectorAll("[data-action='start']").forEach(btn => btn.addEventListener("click", (e) => { e.stopPropagation(); changeStatus(btn.dataset.id, "em_andamento"); }));
        document.querySelectorAll("[data-action='finish']").forEach(btn => btn.addEventListener("click", (e) => { e.stopPropagation(); changeStatus(btn.dataset.id, "entregue"); }));
    }

    function changeStatus(id, newStatus) {
        const idx = deliveries.findIndex(d => d.id === id);
        if(idx !== -1) {
            const old = deliveries[idx].status;
            deliveries[idx].status = newStatus;
            if(newStatus === "entregue" && old !== "entregue") deliveries[idx].entregue_em = new Date().toISOString();
            else if(newStatus !== "entregue") deliveries[idx].entregue_em = null;
            saveToStorage();
            updateStatsAndList();
        }
    }

    function deleteDelivery(id) {
        if(confirm("Remover esta corrida?")) {
            deliveries = deliveries.filter(d => d.id !== id);
            saveToStorage();
            updateStatsAndList();
        }
    }

    function openEditModal(id) {
        const delivery = deliveries.find(d => d.id === id);
        if(delivery) {
            document.getElementById("modalTitle").innerHTML = "✏️ Editar entrega";
            document.getElementById("editId").value = delivery.id;
            document.getElementById("cliente").value = delivery.cliente;
            document.getElementById("endereco").value = delivery.endereco;
            document.getElementById("valor").value = delivery.valor;
            document.getElementById("status").value = delivery.status;
            document.getElementById("obs").value = delivery.observacoes || "";
            document.getElementById("modalOverlay").style.display = "flex";
        }
    }

    function openCreateModal() {
        document.getElementById("modalTitle").innerHTML = "➕ Nova corrida";
        document.getElementById("editId").value = "";
        document.getElementById("cliente").value = "";
        document.getElementById("endereco").value = "";
        document.getElementById("valor").value = "0";
        document.getElementById("status").value = "pendente";
        document.getElementById("obs").value = "";
        document.getElementById("modalOverlay").style.display = "flex";
    }

    function closeModal() {
        document.getElementById("modalOverlay").style.display = "none";
    }

    function saveDeliveryHandler(e) {
        e.preventDefault();
        const id = document.getElementById("editId").value;
        const cliente = document.getElementById("cliente").value.trim();
        const endereco = document.getElementById("endereco").value.trim();
        const valor = parseFloat(document.getElementById("valor").value) || 0;
        const status = document.getElementById("status").value;
        const obs = document.getElementById("obs").value.trim();
        if(!cliente || !endereco) { alert("Preencha cliente e endereço"); return; }
        if(id) {
            const idx = deliveries.findIndex(d => d.id === id);
            if(idx !== -1) {
                deliveries[idx].cliente = cliente;
                deliveries[idx].endereco = endereco;
                deliveries[idx].valor = valor;
                deliveries[idx].observacoes = obs;
                const oldStatus = deliveries[idx].status;
                deliveries[idx].status = status;
                if(status === "entregue" && oldStatus !== "entregue") deliveries[idx].entregue_em = new Date().toISOString();
                else if(status !== "entregue") deliveries[idx].entregue_em = null;
            }
        } else {
            deliveries.unshift({ id: generateId(), cliente, endereco, valor, status, observacoes: obs, criado_em: new Date().toISOString(), entregue_em: status === "entregue" ? new Date().toISOString() : null });
        }
        saveToStorage();
        closeModal();
        updateStatsAndList();
    }

    function initFilters() {
        const btns = document.querySelectorAll(".filter-chip");
        btns.forEach(btn => {
            btn.addEventListener("click", () => {
                btns.forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                currentFilter = btn.dataset.filter;
                renderList();
            });
        });
    }

    // Event listeners
    document.getElementById("deliveryForm").addEventListener("submit", saveDeliveryHandler);
    document.getElementById("openModalBtn").addEventListener("click", openCreateModal);
    document.getElementById("closeModalBtn").addEventListener("click", closeModal);
    window.addEventListener("click", (e) => { if(e.target === document.getElementById("modalOverlay")) closeModal(); });

    loadFromStorage();
    initFilters();
</script>
</body>
</html>
