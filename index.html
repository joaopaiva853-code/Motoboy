<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baixar MotoDash Pro APK</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: linear-gradient(135deg, #0f0f1a, #1a1a2e);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 32px;
            text-align: center;
            max-width: 400px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .icon {
            font-size: 64px;
            margin-bottom: 16px;
        }
        .btn {
            background: linear-gradient(135deg, #ff6b35, #e94560);
            border: none;
            color: white;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            margin-top: 20px;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: scale(1.02);
        }
        .note {
            font-size: 12px;
            color: #aaa;
            margin-top: 24px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🏍️</div>
        <h1>MotoDash Pro</h1>
        <p>Seu app de entregas para motoboy</p>
        <a href="motodash-pro.apk" class="btn" download>📲 Baixar APK (Android)</a>
        <div class="note">
            Versão 2.0 • Tamanho ~4MB<br>
            Permissões: localização, armazenamento, notificações.
        </div>
    </div>
</body>
</html>
