<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ff8c42">
    <title>MotoFlash · Entregas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f4f7fc;
            padding: 16px 12px 32px;
            color: #1a2c3e;
        }

        .app-container {
            max-width: 560px;
            margin: 0 auto;
            background: white;
            border-radius: 36px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.08);
            overflow: hidden;
            padding: 20px 16px 28px;
        }

        /* cabeçalho */
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ff8c42;
        }
        .logo-icon {
            background: #ff8c42;
            width: 48px;
            height: 48px;
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
        }
        .header-text h1 {
            font-size: 1.5rem;
            font-weight: 800;
            color: #1e4668;
        }
        .header-text p {
            font-size: 0.7rem;
            color: #5f7f9e;
        }

        /* estatísticas com fonte um pouco menor */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: #f0f6fa;
            border-radius: 24px;
            padding: 10px 4px;
            text-align: center;
        }
        .stat-number {
            font-size: 1.5rem;
            font-weight: 800;
            color: #ff8c42;
            line-height: 1.2;
        }
        .stat-label {
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            color: #3a6b92;
        }

        /* filtros */
        .filter-bar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            justify-content: center;
        }
        .filter-chip {
            background: #eef3f9;
            border: none;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.7rem;
            color: #2c577c;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-chip.active {
            background: #ff8c42;
            color: white;
        }

        /* lista de entregas */
        .delivery-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-height: 480px;
            overflow-y: auto;
            padding-right: 4px;
            margin-bottom: 24px;
        }
        .delivery-card {
            background: white;
            border-radius: 28px;
            padding: 16px;
            border: 1px solid #e6edf2;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
        }
        .customer {
            font-weight: 800;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #1e4668;
        }
        .status-badge {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 30px;
        }
        .status-pendente { background: #fff1e0; color: #cc6b2c; }
        .status-em_andamento { background: #e3f2fd; color: #0b5e7e; }
        .status-entregue { background: #e0f2e9; color: #2b6e47; }

        .address-line {
            display: flex;
            gap: 8px;
            font-size: 0.75rem;
            color: #3a6b92;
            margin: 8px 0 6px;
            word-break: break-word;
        }
        .price-distance {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 6px 0;
            flex-wrap: wrap;
            gap: 6px;
        }
        .price {
            font-weight: 800;
            font-size: 1rem;
            color: #1e4668;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .distance {
            background: #eef3f9;
            padding: 3px 10px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #ff8c42;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .meta {
            font-size: 0.65rem;
            color: #6f9bc0;
            display: flex;
            gap: 10px;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .action-buttons {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .action-btn {
            border: none;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            background: #f0f6fa;
            color: #2c577c;
        }
        .btn-edit { background: #eef2ff; color: #3b82f6; }
        .btn-delete { background: #fee9e6; color: #e11d48; }
        .btn-start { background: #e3f2fd; color: #0284c7; }
        .btn-finish { background: #e0f2e9; color: #2e7d32; }
        .map-link {
            background: #f0f6fa;
            padding: 2px 8px;
            border-radius: 30px;
            font-size: 0.65rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: #ff8c42;
        }
        .empty-state {
            text-align: center;
            padding: 40px 16px;
            color: #8bb3d0;
            font-size: 0.85rem;
        }

        /* botão flutuante */
        .fab {
            background: #ff8c42;
            width: 56px;
            height: 56px;
            border-radius: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 4px auto 0;
            border: none;
            color: white;
            font-size: 26px;
            box-shadow: 0 8px 18px rgba(255, 140, 66, 0.3);
            cursor: pointer;
        }
        footer {
            text-align: center;
            font-size: 0.6rem;
            color: #8bb3d0;
            margin-top: 16px;
        }

        /* modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(3px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-card {
            background: white;
            border-radius: 40px;
            max-width: 520px;
            width: 100%;
            padding: 24px 20px;
        }
        .modal-card h2 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ff8c42;
            margin-bottom: 18px;
        }
        .field {
            margin-bottom: 16px;
        }
        .field label {
            font-weight: 600;
            font-size: 0.7rem;
            display: block;
            margin-bottom: 5px;
            color: #1e4668;
        }
        .field input, .field select, .field textarea {
            width: 100%;
            padding: 12px 14px;
            border-radius: 28px;
            border: 1px solid #e2edf2;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
        }
        .distance-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .distance-row input { flex: 2; }
        .calc-btn {
            background: #ff8c42;
            border: none;
            padding: 10px 14px;
            border-radius: 30px;
            color: white;
            font-weight: 600;
            font-size: 0.7rem;
            white-space: nowrap;
            cursor: pointer;
        }
        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 20px;
        }
        .btn-save { background: #ff8c42; border: none; padding: 10px 22px; border-radius: 40px; font-weight: 700; color: white; cursor: pointer; }
        .btn-cancel { background: #eef3f9; border: none; padding: 10px 20px; border-radius: 40px; font-weight: 600; cursor: pointer; }
        .small-note { font-size: 0.6rem; color: #6f9bc0; margin-top: 4px; }

        .install-banner {
            background: #ff8c42;
            color: white;
            text-align: center;
            padding: 8px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div id="installBanner" class="install-banner">📲 Instalar app na tela inicial</div>
    <div class="header">
        <div class="logo-icon"><i class="fas fa-motorcycle"></i></div>
        <div class="header-text">
            <h1>MotoFlash</h1>
            <p>entregas com distância</p>
        </div>
    </div>

    <div class="stats-row">
        <div class="stat-card"><div class="stat-number" id="totalCount">0</div><div class="stat-label">Total</div></div>
        <div class="stat-card"><div class="stat-number" id="pendingCount">0</div><div class="stat-label">Pendentes</div></div>
        <div class="stat-card"><div class="stat-number" id="totalEarn">R$0</div><div class="stat-label">Ganhos</div></div>
    </div>

    <div class="filter-bar">
        <button class="filter-chip active" data-filter="all">Todas</button>
        <button class="filter-chip" data-filter="pendente">Pendentes</button>
        <button class="filter-chip" data-filter="em_andamento">Andamento</button>
        <button class="filter-chip" data-filter="entregue">Entregues</button>
    </div>

    <div id="deliveryList" class="delivery-list">
        <div class="empty-state"><i class="fas fa-shipping-fast"></i> Nenhuma entrega. Toque em +</div>
    </div>

    <button class="fab" id="openModalBtn"><i class="fas fa-plus"></i></button>
    <footer>✓ Edite, calcule distância, inicie/finalize</footer>
</div>

<!-- Modal -->
<div id="modal" class="modal">
    <div class="modal-card">
        <h2 id="modalTitle">➕ Nova corrida</h2>
        <form id="deliveryForm">
            <input type="hidden" id="editId">
            <div class="field">
                <label><i class="fas fa-user"></i> Cliente</label>
                <input type="text" id="client" placeholder="Nome" required>
            </div>
            <div class="field">
                <label><i class="fas fa-location-dot"></i> Endereço</label>
                <input type="text" id="address" placeholder="Rua, número, bairro, cidade" required>
            </div>
            <div class="field">
                <label><i class="fas fa-tag"></i> Valor (R$)</label>
                <input type="number" id="price" step="0.01" value="0">
            </div>
            <div class="field">
                <label><i class="fas fa-road"></i> Distância (km)</label>
                <div class="distance-row">
                    <input type="number" id="distance" step="0.1" value="0">
                    <button type="button" class="calc-btn" id="calcDistBtn"><i class="fas fa-location-dot"></i> Calcular</button>
                </div>
                <div class="small-note">🔍 Clique para obter a distância da sua localização atual até o endereço</div>
            </div>
            <div class="field">
                <label><i class="fas fa-chart-line"></i> Status</label>
                <select id="status">
                    <option value="pendente">Pendente</option>
                    <option value="em_andamento">Em andamento</option>
                    <option value="entregue">Entregue</option>
                </select>
            </div>
            <div class="field">
                <label><i class="fas fa-comment"></i> Obs</label>
                <textarea id="notes" rows="2" placeholder="Portão, referência..."></textarea>
            </div>
            <div class="modal-buttons">
                <button type="button" class="btn-cancel" id="closeModalBtn">Cancelar</button>
                <button type="submit" class="btn-save">Salvar</button>
            </div>
        </form>
    </div>
</div>

<script>
    // ---------- DADOS ----------
    let deliveries = [];
    let currentFilter = "all";
    let deferredPrompt = null;

    // Carregar do localStorage
    function loadData() {
        const saved = localStorage.getItem("motoflash_data");
        if(saved) {
            deliveries = JSON.parse(saved);
        } else {
            deliveries = [
                { id: "1", cliente: "Ana Silva", endereco: "Rua Augusta, 1200 - Consolação, SP", valor: 18.5, distancia: 4.2, status: "pendente", obs: "Apto 204", criado: new Date(Date.now() - 2*3600000).toISOString(), entregue_em: null },
                { id: "2", cliente: "Carlos M.", endereco: "Av. Paulista, 1500 - Bela Vista, SP", valor: 22.0, distancia: 3.5, status: "em_andamento", obs: "", criado: new Date(Date.now() - 5*3600000).toISOString(), entregue_em: null },
                { id: "3", cliente: "Fernanda R.", endereco: "Rua Oscar Freire, 980 - Jardins, SP", valor: 27.3, distancia: 5.1, status: "entregue", obs: "Portaria", criado: new Date(Date.now() - 2*86400000).toISOString(), entregue_em: new Date(Date.now() - 86400000).toISOString() }
            ];
            saveLocal();
        }
        renderAll();
    }

    function saveLocal() {
        localStorage.setItem("motoflash_data", JSON.stringify(deliveries));
    }

    function generateId() {
        return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
    }

    function updateStats() {
        const total = deliveries.length;
        const pending = deliveries.filter(d => d.status === "pendente").length;
        const earnings = deliveries.filter(d => d.status === "entregue").reduce((s, d) => s + (d.valor || 0), 0);
        document.getElementById("totalCount").innerText = total;
        document.getElementById("pendingCount").innerText = pending;
        document.getElementById("totalEarn").innerHTML = `R$${earnings.toFixed(2)}`;
    }

    function renderList() {
        let filtered = [...deliveries];
        if(currentFilter !== "all") filtered = filtered.filter(d => d.status === currentFilter);
        filtered.sort((a,b) => {
            const prio = { pendente:1, em_andamento:2, entregue:3 };
            return (prio[a.status] - prio[b.status]) || new Date(b.criado) - new Date(a.criado);
        });

        const container = document.getElementById("deliveryList");
        if(filtered.length === 0) {
            container.innerHTML = `<div class="empty-state"><i class="fas fa-road"></i><br>Nenhuma entrega aqui.</div>`;
            return;
        }

        container.innerHTML = filtered.map(d => {
            const statusText = { pendente:"Pendente", em_andamento:"Em andamento", entregue:"Entregue" }[d.status];
            const statusClass = `status-${d.status}`;
            const dateStr = new Date(d.criado).toLocaleDateString("pt-BR", {day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit"});
            let actionBtns = "";
            if(d.status === "pendente") actionBtns = `<button class="action-btn btn-start" data-action="start" data-id="${d.id}"><i class="fas fa-play"></i> Iniciar</button>`;
            else if(d.status === "em_andamento") actionBtns = `<button class="action-btn btn-finish" data-action="finish" data-id="${d.id}"><i class="fas fa-flag-checkered"></i> Concluir</button>`;
            const mapsLink = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(d.endereco)}`;
            return `
                <div class="delivery-card">
                    <div class="card-header">
                        <div class="customer"><i class="fas fa-user-circle"></i> ${escapeHtml(d.cliente)}</div>
                        <div class="status-badge ${statusClass}">${statusText}</div>
                    </div>
                    <div class="address-line">
                        <i class="fas fa-map-marker-alt"></i> <span>${escapeHtml(d.endereco)}</span>
                        <a href="${mapsLink}" target="_blank" class="map-link"><i class="fas fa-external-link-alt"></i> mapa</a>
                    </div>
                    <div class="price-distance">
                        <div class="price"><i class="fas fa-money-bill-wave"></i> R$ ${(d.valor||0).toFixed(2)}</div>
                        <div class="distance"><i class="fas fa-road"></i> ${(d.distancia||0).toFixed(1)} km</div>
                    </div>
                    <div class="meta">
                        <span><i class="far fa-clock"></i> ${dateStr}</span>
                        ${d.obs ? `<span><i class="fas fa-note-sticky"></i> ${escapeHtml(d.obs.substring(0,35))}</span>` : ''}
                    </div>
                    <div class="action-buttons">
                        <button class="action-btn btn-edit" data-action="edit" data-id="${d.id}"><i class="fas fa-pen"></i> Editar</button>
                        ${actionBtns}
                        <button class="action-btn btn-delete" data-action="delete" data-id="${d.id}"><i class="fas fa-trash"></i> Excluir</button>
                    </div>
                </div>
            `;
        }).join("");

        // eventos dinâmicos
        document.querySelectorAll("[data-action='edit']").forEach(btn => btn.addEventListener("click", (e) => { e.stopPropagation(); openEdit(btn.dataset.id); }));
        document.querySelectorAll("[data-action='delete']").forEach(btn => btn.addEventListener("click", (e) => { e.stopPropagation(); deleteDelivery(btn.dataset.id); }));
        document.querySelectorAll("[data-action='start']").forEach(btn => btn.addEventListener("click", (e) => { e.stopPropagation(); changeStatus(btn.dataset.id, "em_andamento"); }));
        document.querySelectorAll("[data-action='finish']").forEach(btn => btn.addEventListener("click", (e) => { e.stopPropagation(); changeStatus(btn.dataset.id, "entregue"); }));
    }

    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, (m) => m==='&'?'&amp;':(m==='<'?'&lt;':'&gt;')); }
    function renderAll() { updateStats(); renderList(); }

    // CRUD
    function saveDelivery(e) {
        e.preventDefault();
        const id = document.getElementById("editId").value;
        const cliente = document.getElementById("client").value.trim();
        const endereco = document.getElementById("address").value.trim();
        const valor = parseFloat(document.getElementById("price").value) || 0;
        const distancia = parseFloat(document.getElementById("distance").value) || 0;
        const status = document.getElementById("status").value;
        const obs = document.getElementById("notes").value.trim();
        if(!cliente || !endereco) { alert("Preencha cliente e endereço"); return; }
        if(id) {
            const idx = deliveries.findIndex(d => d.id === id);
            if(idx !== -1) {
                const old = deliveries[idx].status;
                deliveries[idx] = { ...deliveries[idx], cliente, endereco, valor, distancia, status, obs };
                if(status === "entregue" && old !== "entregue") deliveries[idx].entregue_em = new Date().toISOString();
                else if(status !== "entregue") deliveries[idx].entregue_em = null;
            }
        } else {
            deliveries.unshift({
                id: generateId(), cliente, endereco, valor, distancia, status, obs,
                criado: new Date().toISOString(),
                entregue_em: status === "entregue" ? new Date().toISOString() : null
            });
        }
        saveLocal();
        closeModal();
        renderAll();
    }

    function deleteDelivery(id) {
        if(confirm("Excluir esta corrida?")) {
            deliveries = deliveries.filter(d => d.id !== id);
            saveLocal();
            renderAll();
        }
    }

    function changeStatus(id, newStatus) {
        const idx = deliveries.findIndex(d => d.id === id);
        if(idx !== -1) {
            const old = deliveries[idx].status;
            deliveries[idx].status = newStatus;
            if(newStatus === "entregue" && old !== "entregue") deliveries[idx].entregue_em = new Date().toISOString();
            else if(newStatus !== "entregue") deliveries[idx].entregue_em = null;
            saveLocal();
            renderAll();
        }
    }

    // Cálculo de distância usando OSRM + Nominatim
    async function calcDistanceFromAddress(address) {
        const geoUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&limit=1`;
        try {
            const geoRes = await fetch(geoUrl, { headers: { 'User-Agent': 'MotoFlash/1.0' } });
            const geoData = await geoRes.json();
            if(!geoData.length) throw new Error("Endereço não encontrado");
            const { lat, lon } = geoData[0];
            const pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej));
            const userLat = pos.coords.latitude, userLon = pos.coords.longitude;
            const routeUrl = `https://router.project-osrm.org/route/v1/driving/${userLon},${userLat};${lon},${lat}?overview=false`;
            const routeRes = await fetch(routeUrl);
            const routeData = await routeRes.json();
            if(routeData.code !== "Ok") throw new Error("Rota não encontrada");
            return routeData.routes[0].distance / 1000;
        } catch(e) {
            alert("Erro: " + e.message);
            return null;
        }
    }

    async function handleCalcDistance() {
        const addr = document.getElementById("address").value.trim();
        if(!addr) { alert("Digite o endereço primeiro."); return; }
        if(!navigator.geolocation) { alert("Geolocalização não suportada."); return; }
        const btn = document.getElementById("calcDistBtn");
        const original = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> calculando...';
        btn.disabled = true;
        try {
            const dist = await calcDistanceFromAddress(addr);
            if(dist !== null) {
                document.getElementById("distance").value = dist.toFixed(1);
                alert(`Distância calculada: ${dist.toFixed(1)} km`);
            }
        } catch(err) { alert("Falha no cálculo."); }
        finally { btn.innerHTML = original; btn.disabled = false; }
    }

    // Modal
    function openEdit(id) {
        const d = deliveries.find(d => d.id === id);
        if(d) {
            document.getElementById("modalTitle").innerText = "✏️ Editar entrega";
            document.getElementById("editId").value = d.id;
            document.getElementById("client").value = d.cliente;
            document.getElementById("address").value = d.endereco;
            document.getElementById("price").value = d.valor;
            document.getElementById("distance").value = d.distancia || 0;
            document.getElementById("status").value = d.status;
            document.getElementById("notes").value = d.obs || "";
            openModal();
        }
    }

    function openCreate() {
        document.getElementById("modalTitle").innerText = "➕ Nova corrida";
        document.getElementById("editId").value = "";
        document.getElementById("client").value = "";
        document.getElementById("address").value = "";
        document.getElementById("price").value = "0";
        document.getElementById("distance").value = "0";
        document.getElementById("status").value = "pendente";
        document.getElementById("notes").value = "";
        openModal();
    }

    function openModal() { document.getElementById("modal").style.display = "flex"; }
    function closeModal() { document.getElementById("modal").style.display = "none"; }

    // Filtros
    function initFilters() {
        document.querySelectorAll(".filter-chip").forEach(btn => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".filter-chip").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                currentFilter = btn.dataset.filter;
                renderList();
            });
        });
    }

    // PWA install prompt
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        const banner = document.getElementById("installBanner");
        banner.style.display = "block";
        banner.onclick = async () => {
            banner.style.display = "none";
            if(deferredPrompt) { deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; }
        };
    });

    document.getElementById("deliveryForm").addEventListener("submit", saveDelivery);
    document.getElementById("openModalBtn").addEventListener("click", openCreate);
    document.getElementById("closeModalBtn").addEventListener("click", closeModal);
    document.getElementById("calcDistBtn").addEventListener("click", handleCalcDistance);
    window.addEventListener("click", (e) => { if(e.target === document.getElementById("modal")) closeModal(); });

    loadData();
    initFilters();

    // Service Worker para offline (básico)
    if('serviceWorker' in navigator) {
        const swCode = `self.addEventListener('fetch', event => { event.respondWith(fetch(event.request).catch(() => new Response('Offline', { status: 200 }))); });`;
        const blob = new Blob([swCode], {type: 'application/javascript'});
        navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(e => console.log("SW erro", e));
    }
</script>
</body>
</html>
