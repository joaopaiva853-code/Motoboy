<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>MotoExpress · Gestão de Entregas</title>
    <!-- Font Awesome 6 (ícones maiores também) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts: Inter para tipografia robusta -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #eef2ff;
            padding: 20px 16px 32px 16px;
            color: #0f172a;
        }

        /* Container estilo "app" mais espaçoso */
        .app-container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 40px;
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            padding: 24px 22px 32px 22px;
        }

        /* cabeçalho maior */
        .header {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 1;
        }
        .logo-icon {
            background: #e11d48;
            width: 64px;
            height: 64px;
            border-radius: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 34px;
            box-shadow: 0 8px 14px rgba(225, 29, 72, 0.25);
        }
        .title h1 {
            font-size: 1.9rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #e11d48, #f97316);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .title p {
            font-size: 0.9rem;
            font-weight: 500;
            color: #475569;
            margin-top: 4px;
        }

        /* cards estatísticas – números bem maiores */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: #f8fafc;
            border-radius: 28px;
            padding: 18px 8px;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            transition: 0.1s;
        }
        .stat-value {
            font-size: 2.4rem;
            font-weight: 800;
            color: #0f172a;
            line-height: 1.2;
        }
        .stat-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
            letter-spacing: 0.3px;
            margin-top: 6px;
        }

        /* filtros com botões maiores */
        .filter-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 28px;
            border-bottom: 2px solid #eef2ff;
            padding-bottom: 16px;
        }
        .filter-btn {
            background: #f1f5f9;
            border: none;
            padding: 10px 20px;
            border-radius: 48px;
            font-weight: 700;
            font-size: 0.9rem;
            color: #334155;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .filter-btn.active {
            background: #e11d48;
            color: white;
            box-shadow: 0 4px 12px rgba(225,29,72,0.35);
        }

        /* lista de entregas – cards maiores e mais legíveis */
        .deliveries-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 32px;
            max-height: 520px;
            overflow-y: auto;
            padding-right: 6px;
        }
        .delivery-card {
            background: #ffffff;
            border-radius: 32px;
            padding: 20px 18px;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0, 0, 0, 0.03);
            border: 1px solid #eef2ff;
            transition: 0.1s;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .client-name {
            font-weight: 800;
            font-size: 1.35rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .client-name i {
            font-size: 1.6rem;
            color: #e11d48;
        }
        .status-tag {
            font-size: 0.8rem;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 40px;
            text-transform: uppercase;
        }
        .status-pendente { background: #ffedd5; color: #9a3412; }
        .status-em_andamento { background: #dbeafe; color: #1e40af; }
        .status-entregue { background: #dcfce7; color: #166534; }

        .address {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 1rem;
            color: #1e293b;
            margin: 12px 0 10px 0;
            word-break: break-word;
        }
        .address i {
            font-size: 1.2rem;
            margin-top: 2px;
            color: #3b82f6;
        }
        .price-row {
            font-weight: 800;
            color: #0f172a;
            font-size: 1.3rem;
            margin: 10px 0 8px 0;
        }
        .price-row i {
            font-size: 1.2rem;
            margin-right: 6px;
            color: #f97316;
        }
        .meta-info {
            font-size: 0.8rem;
            color: #475569;
            display: flex;
            gap: 16px;
            margin-top: 12px;
            flex-wrap: wrap;
            background: #fafcff;
            padding: 8px 0 4px;
            border-radius: 20px;
        }
        .card-actions {
            display: flex;
            gap: 14px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .btn-icon {
            background: transparent;
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 48px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Inter', sans-serif;
        }
        .btn-edit { background: #f1f5f9; color: #2563eb; }
        .btn-delete { background: #fff1f2; color: #e11d48; }
        .btn-start { background: #eef2ff; color: #2563eb; font-weight: 700; }
        .btn-finish { background: #dcfce7; color: #15803d; font-weight: 700; }
        .map-link {
            background: #f1f4f9;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            text-decoration: none;
            color: #2563eb;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: #94a3b8;
            font-size: 1.1rem;
            font-weight: 500;
        }
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 12px;
            display: block;
        }

        /* botão flutuante + maior */
        .fab-add {
            background: #e11d48;
            border: none;
            width: 68px;
            height: 68px;
            border-radius: 40px;
            color: white;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px auto;
            box-shadow: 0 12px 22px rgba(225,29,72,0.4);
            cursor: pointer;
            transition: 0.2s;
        }
        .fab-add:hover {
            background: #be123c;
            transform: scale(0.96);
        }

        /* MODAL maior, inputs confortáveis */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-card {
            background: white;
            max-width: 550px;
            width: 100%;
            border-radius: 48px;
            padding: 30px 26px;
            box-shadow: 0 30px 45px rgba(0,0,0,0.25);
            animation: fadeUp 0.2s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(25px);}
            to { opacity: 1; transform: translateY(0);}
        }
        .modal-card h2 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 22px;
        }
        .form-group label {
            font-weight: 700;
            font-size: 0.95rem;
            display: block;
            margin-bottom: 8px;
            color: #0f172a;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 14px 18px;
            border-radius: 28px;
            border: 1.5px solid #e2e8f0;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            background: #ffffff;
        }
        .modal-buttons {
            display: flex;
            gap: 16px;
            justify-content: flex-end;
            margin-top: 30px;
        }
        .btn-save {
            background: #e11d48;
            border: none;
            color: white;
            padding: 12px 28px;
            border-radius: 48px;
            font-weight: 700;
            font-size: 1rem;
        }
        .btn-cancel {
            background: #f1f5f9;
            border: none;
            padding: 12px 28px;
            border-radius: 48px;
            font-weight: 600;
            font-size: 1rem;
        }
        footer {
            font-size: 0.8rem;
            text-align: center;
            margin-top: 20px;
            color: #64748b;
            font-weight: 500;
        }
        /* ajustes responsivos */
        @media (max-width: 500px) {
            .app-container { padding: 18px; }
            .client-name { font-size: 1.2rem; }
            .stat-value { font-size: 1.9rem; }
            .btn-icon { padding: 8px 14px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <div class="logo-area">
            <div class="logo-icon"><i class="fas fa-motorcycle"></i></div>
            <div class="title">
                <h1>MotoExpress</h1>
                <p>Gerencie corridas • entregas locais</p>
            </div>
        </div>
        <!-- Botão DEMO removido conforme solicitado -->
    </div>

    <!-- estatísticas com números maiores -->
    <div class="stats-grid">
        <div class="stat-card"><div class="stat-value" id="totalDeliveries">0</div><div class="stat-label">Total corridas</div></div>
        <div class="stat-card"><div class="stat-value" id="pendingCount">0</div><div class="stat-label">Pendentes</div></div>
        <div class="stat-card"><div class="stat-value" id="earningsTotal">R$0</div><div class="stat-label">Ganho (entregues)</div></div>
    </div>

    <!-- filtros -->
    <div class="filter-bar">
        <button class="filter-btn active" data-filter="all">Todas</button>
        <button class="filter-btn" data-filter="pendente">Pendentes</button>
        <button class="filter-btn" data-filter="em_andamento">Em andamento</button>
        <button class="filter-btn" data-filter="entregue">Entregues</button>
    </div>

    <!-- lista de corridas -->
    <div id="deliveriesList" class="deliveries-list">
        <div class="empty-state"><i class="fas fa-scooter"></i> Nenhuma corrida ainda.<br>Toque em + para criar</div>
    </div>

    <!-- botão flutuante de adicionar -->
    <button class="fab-add" id="openAddModal"><i class="fas fa-plus"></i></button>
    <footer>Edite suas corridas, inicie entregas e finalize ✔️ Dados salvos no dispositivo</footer>
</div>

<!-- MODAL -->
<div id="modalOverlay" class="modal">
    <div class="modal-card">
        <h2 id="modalTitle">Nova corrida</h2>
        <form id="deliveryForm">
            <input type="hidden" id="editId" value="">
            <div class="form-group">
                <label><i class="fas fa-user"></i> Cliente *</label>
                <input type="text" id="cliente" placeholder="Ex: Ana Souza" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-location-dot"></i> Endereço completo *</label>
                <input type="text" id="endereco" placeholder="Rua, número, bairro, cidade" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-tag"></i> Valor (R$)</label>
                <input type="number" id="valor" step="0.01" placeholder="0,00" value="0">
            </div>
            <div class="form-group">
                <label><i class="fas fa-chart-line"></i> Status</label>
                <select id="statusSelect">
                    <option value="pendente">Pendente</option>
                    <option value="em_andamento">Em andamento</option>
                    <option value="entregue">Entregue</option>
                </select>
            </div>
            <div class="form-group">
                <label><i class="fas fa-note-sticky"></i> Observações (opcional)</label>
                <textarea id="obs" rows="2" placeholder="Portão, ponto de referência..."></textarea>
            </div>
            <div class="modal-buttons">
                <button type="button" class="btn-cancel" id="closeModalBtn">Cancelar</button>
                <button type="submit" class="btn-save">Salvar corrida</button>
            </div>
        </form>
    </div>
</div>

<script>
    // ---------- DADOS E PERSISTÊNCIA ----------
    let deliveries = [];     
    let currentFilter = "all";

    function loadData() {
        const stored = localStorage.getItem("motoexpress_deliveries");
        if(stored) {
            deliveries = JSON.parse(stored);
        } else {
            // dados iniciais da cidade local
            deliveries = [
                {
                    id: "d1",
                    cliente: "Carlos M.",
                    endereco: "Rua das Laranjeiras, 234 - Centro, São Paulo",
                    valor: 12.50,
                    status: "pendente",
                    observacoes: "Entregar no apto 12B",
                    criado_em: new Date(Date.now() - 3600000).toISOString(),
                    entregue_em: null
                },
                {
                    id: "d2",
                    cliente: "Juliana Lima",
                    endereco: "Av. Paulista, 1578 - Bela Vista",
                    valor: 18.90,
                    status: "em_andamento",
                    observacoes: "Pessoal da recepção",
                    criado_em: new Date(Date.now() - 7200000).toISOString(),
                    entregue_em: null
                },
                {
                    id: "d3",
                    cliente: "Ricardo Alves",
                    endereco: "Rua Augusta, 1020 - Consolação",
                    valor: 22.00,
                    status: "entregue",
                    observacoes: "Deixar na portaria",
                    criado_em: new Date(Date.now() - 86400000).toISOString(),
                    entregue_em: new Date(Date.now() - 3600000).toISOString()
                }
            ];
            saveToLocal();
        }
        renderStats();
        renderList();
    }

    function saveToLocal() {
        localStorage.setItem("motoexpress_deliveries", JSON.stringify(deliveries));
    }

    function generateId() {
        return Date.now().toString(36) + Math.random().toString(36).substring(2);
    }

    // Salvar (criar ou editar)
    function saveDelivery(event) {
        event.preventDefault();
        const id = document.getElementById("editId").value;
        const cliente = document.getElementById("cliente").value.trim();
        const endereco = document.getElementById("endereco").value.trim();
        const valorRaw = document.getElementById("valor").value;
        const valor = parseFloat(valorRaw) || 0;
        const status = document.getElementById("statusSelect").value;
        const observacoes = document.getElementById("obs").value.trim();

        if(!cliente || !endereco) {
            alert("Preencha cliente e endereço.");
            return;
        }

        if(id) {
            // Editar existente
            const index = deliveries.findIndex(d => d.id === id);
            if(index !== -1) {
                const oldStatus = deliveries[index].status;
                deliveries[index].cliente = cliente;
                deliveries[index].endereco = endereco;
                deliveries[index].valor = valor;
                deliveries[index].observacoes = observacoes;
                const newStatus = status;
                if(newStatus === "entregue" && oldStatus !== "entregue") {
                    deliveries[index].entregue_em = new Date().toISOString();
                } else if(newStatus !== "entregue") {
                    deliveries[index].entregue_em = null;
                } else if(newStatus === "entregue" && deliveries[index].entregue_em === null) {
                    deliveries[index].entregue_em = new Date().toISOString();
                }
                deliveries[index].status = newStatus;
            }
        } else {
            // Nova corrida
            const newDelivery = {
                id: generateId(),
                cliente: cliente,
                endereco: endereco,
                valor: valor,
                status: status,
                observacoes: observacoes,
                criado_em: new Date().toISOString(),
                entregue_em: (status === "entregue") ? new Date().toISOString() : null,
            };
            deliveries.unshift(newDelivery);
        }
        saveToLocal();
        closeModal();
        renderStats();
        renderList();
    }

    function deleteDelivery(id) {
        if(confirm("Remover esta corrida permanentemente?")) {
            deliveries = deliveries.filter(d => d.id !== id);
            saveToLocal();
            renderStats();
            renderList();
        }
    }

    function quickUpdateStatus(id, newStatus) {
        const index = deliveries.findIndex(d => d.id === id);
        if(index !== -1) {
            const oldStatus = deliveries[index].status;
            deliveries[index].status = newStatus;
            if(newStatus === "entregue" && oldStatus !== "entregue") {
                deliveries[index].entregue_em = new Date().toISOString();
            } else if(newStatus !== "entregue") {
                deliveries[index].entregue_em = null;
            }
            saveToLocal();
            renderStats();
            renderList();
        }
    }

    // Modal: editar ou criar
    function openEditModal(id) {
        const delivery = deliveries.find(d => d.id === id);
        if(delivery) {
            document.getElementById("modalTitle").innerText = "✏️ Editar corrida";
            document.getElementById("editId").value = delivery.id;
            document.getElementById("cliente").value = delivery.cliente;
            document.getElementById("endereco").value = delivery.endereco;
            document.getElementById("valor").value = delivery.valor;
            document.getElementById("statusSelect").value = delivery.status;
            document.getElementById("obs").value = delivery.observacoes || "";
            document.getElementById("modalOverlay").style.display = "flex";
        }
    }

    function openCreateModal() {
        document.getElementById("modalTitle").innerText = "➕ Nova corrida";
        document.getElementById("editId").value = "";
        document.getElementById("cliente").value = "";
        document.getElementById("endereco").value = "";
        document.getElementById("valor").value = "0";
        document.getElementById("statusSelect").value = "pendente";
        document.getElementById("obs").value = "";
        document.getElementById("modalOverlay").style.display = "flex";
    }

    function closeModal() {
        document.getElementById("modalOverlay").style.display = "none";
    }

    // Atualizar estatísticas com números grandes
    function renderStats() {
        const total = deliveries.length;
        const pending = deliveries.filter(d => d.status === "pendente").length;
        const earnings = deliveries.filter(d => d.status === "entregue").reduce((sum, d) => sum + (d.valor || 0), 0);
        document.getElementById("totalDeliveries").innerText = total;
        document.getElementById("pendingCount").innerText = pending;
        document.getElementById("earningsTotal").innerHTML = `R$${earnings.toFixed(2)}`;
    }

    // Renderizar lista com filtro e visual expansivo
    function renderList() {
        let filtered = [...deliveries];
        if(currentFilter !== "all") {
            filtered = filtered.filter(d => d.status === currentFilter);
        }
        filtered.sort((a,b) => {
            const order = { "pendente": 1, "em_andamento": 2, "entregue": 3 };
            const orderA = order[a.status] || 4;
            const orderB = order[b.status] || 4;
            if(orderA !== orderB) return orderA - orderB;
            return new Date(b.criado_em) - new Date(a.criado_em);
        });

        const container = document.getElementById("deliveriesList");
        if(filtered.length === 0) {
            container.innerHTML = `<div class="empty-state"><i class="fas fa-road"></i> Nenhuma corrida neste filtro.<br>Toque em + para criar</div>`;
            return;
        }

        container.innerHTML = filtered.map(del => {
            const statusText = { "pendente": "Pendente", "em_andamento": "Em andamento", "entregue": "Entregue" }[del.status];
            const statusClass = `status-${del.status}`;
            const valorFormat = (del.valor || 0).toFixed(2);
            const criadoData = new Date(del.criado_em).toLocaleDateString("pt-BR", {day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit"});
            let actionButtons = "";
            if(del.status === "pendente") {
                actionButtons = `<button class="btn-icon btn-start" data-action="start" data-id="${del.id}"><i class="fas fa-play"></i> Iniciar</button>`;
            } else if(del.status === "em_andamento") {
                actionButtons = `<button class="btn-icon btn-finish" data-action="finish" data-id="${del.id}"><i class="fas fa-check-circle"></i> Concluir</button>`;
            }
            const mapsLink = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(del.endereco)}`;
            return `
                <div class="delivery-card" data-id="${del.id}">
                    <div class="card-header">
                        <div class="client-name"><i class="fas fa-user-circle"></i> ${escapeHtml(del.cliente)}</div>
                        <div class="status-tag ${statusClass}">${statusText}</div>
                    </div>
                    <div class="address">
                        <i class="fas fa-map-pin"></i> <span>${escapeHtml(del.endereco)}</span>
                        <a href="${mapsLink}" target="_blank" class="map-link" rel="noopener"><i class="fas fa-external-link-alt"></i> mapa</a>
                    </div>
                    <div class="price-row"><i class="fas fa-money-bill-wave"></i> R$ ${valorFormat}</div>
                    <div class="meta-info">
                        <span><i class="far fa-calendar-alt"></i> ${criadoData}</span>
                        ${del.observacoes ? `<span><i class="fas fa-comment"></i> ${escapeHtml(del.observacoes.substring(0, 45))}</span>` : ''}
                    </div>
                    <div class="card-actions">
                        <button class="btn-icon btn-edit" data-action="edit" data-id="${del.id}"><i class="fas fa-pen"></i> Editar</button>
                        ${actionButtons}
                        <button class="btn-icon btn-delete" data-action="delete" data-id="${del.id}"><i class="fas fa-trash-alt"></i> Excluir</button>
                    </div>
                </div>
            `;
        }).join("");

        // Reatribuir eventos
        document.querySelectorAll("[data-action='edit']").forEach(btn => {
            btn.addEventListener("click", (e) => {
                e.stopPropagation();
                const id = btn.getAttribute("data-id");
                openEditModal(id);
            });
        });
        document.querySelectorAll("[data-action='delete']").forEach(btn => {
            btn.addEventListener("click", (e) => {
                e.stopPropagation();
                const id = btn.getAttribute("data-id");
                deleteDelivery(id);
            });
        });
        document.querySelectorAll("[data-action='start']").forEach(btn => {
            btn.addEventListener("click", (e) => {
                e.stopPropagation();
                const id = btn.getAttribute("data-id");
                quickUpdateStatus(id, "em_andamento");
            });
        });
        document.querySelectorAll("[data-action='finish']").forEach(btn => {
            btn.addEventListener("click", (e) => {
                e.stopPropagation();
                const id = btn.getAttribute("data-id");
                quickUpdateStatus(id, "entregue");
            });
        });
    }

    function escapeHtml(str) {
        if(!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }

    // Filtros
    function initFilters() {
        const btns = document.querySelectorAll(".filter-btn");
        btns.forEach(btn => {
            btn.addEventListener("click", () => {
                btns.forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                currentFilter = btn.getAttribute("data-filter");
                renderList();
            });
        });
    }

    // Eventos globais
    document.getElementById("deliveryForm").addEventListener("submit", saveDelivery);
    document.getElementById("openAddModal").addEventListener("click", openCreateModal);
    document.getElementById("closeModalBtn").addEventListener("click", closeModal);
    window.addEventListener("click", (e) => {
        const modal = document.getElementById("modalOverlay");
        if(e.target === modal) closeModal();
    });

    // Inicialização
    loadData();
    initFilters();
</script>
</body>
</html>
